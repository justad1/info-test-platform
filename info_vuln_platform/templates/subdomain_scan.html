{% extends 'base.html' %}

{% block title %}子域名扫描{% endblock %}

{% block page_title %}子域名扫描{% endblock %}

{% block content %}
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <!-- 扫描表单卡片 -->
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">子域名扫描</div>
                <div class="layui-card-body">
                    <form class="layui-form" id="scan-form">
                        <div class="layui-form-item">
                            <label class="layui-form-label">主域名</label>
                            <div class="layui-input-block">
                                <input type="text" name="domain" required lay-verify="required" placeholder="请输入主域名，如：example.com" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" lay-submit lay-filter="scan-submit">开始扫描</button>
                                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- 扫描结果卡片 -->
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">扫描结果</div>
                <div class="layui-card-body">
                    <div class="layui-tab layui-tab-brief" lay-filter="scan-result-tab">
                        <ul class="layui-tab-title">
                            <li class="layui-this">子域名列表</li>
                            <li>扫描历史</li>
                        </ul>
                        <div class="layui-tab-content">
                            <!-- 子域名列表标签页 -->
                            <div class="layui-tab-item layui-show">
                                <div id="result-container" style="display: none;">
                                    <div class="layui-row">
                                        <div class="layui-col-md12">
                                            <div class="layui-card">
                                                <div class="layui-card-header">
                                                    <div class="layui-row">
                                                        <div class="layui-col-md6">
                                                            <span id="scan-domain"></span> 
                                                            <span class="layui-badge layui-bg-blue" id="found-count"></span>
                                                        </div>
                                                        <div class="layui-col-md6" style="text-align: right;">
                                                            <span id="scan-time"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="layui-card-body">
                                                    <table id="subdomain-table" lay-filter="subdomain-table"></table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="no-result-container" style="text-align: center; padding: 50px;">
                                    <i class="layui-icon layui-icon-search" style="font-size: 50px; color: #ccc;"></i>
                                    <p style="color: #ccc; margin-top: 10px;">请输入主域名开始扫描</p>
                                </div>
                            </div>
                            
                            <!-- 扫描历史标签页 -->
                            <div class="layui-tab-item">
                                <table id="scan-history-table" lay-filter="scan-history-table"></table>
                                
                                <script type="text/html" id="scan-history-toolbar">
                                    <div class="layui-btn-container">
                                        <button class="layui-btn layui-btn-sm" lay-event="view"><i class="layui-icon">&#xe615;</i> 查看</button>
                                    </div>
                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 扫描详情弹窗 -->
<div id="scan-detail-container" style="display: none; padding: 20px;">
    <div class="layui-row">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">
                    <div class="layui-row">
                        <div class="layui-col-md6">
                            <span id="detail-domain"></span> 
                            <span class="layui-badge layui-bg-blue" id="detail-found-count"></span>
                        </div>
                        <div class="layui-col-md6" style="text-align: right;">
                            <span id="detail-time"></span>
                        </div>
                    </div>
                </div>
                <div class="layui-card-body">
                    <table id="detail-table" lay-filter="detail-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
layui.use(['table', 'form', 'jquery', 'layer', 'element'], function(){
    var table = layui.table;
    var form = layui.form;
    var $ = layui.jquery;
    var layer = layui.layer;
    var element = layui.element;
    
    // 当前扫描ID
    var currentScanId = null;
    
    // 初始化扫描历史表格
    table.render({
        elem: '#scan-history-table',
        url: '/manager/api/subdomain/scan/',  // 后端API接口
        page: true,
        cols: [[
            {field: 'id', title: 'ID', width: 80, sort: true},
            {field: 'domain', title: '主域名', width: 200},
            {field: 'status', title: '状态', width: 100, templet: function(d){
                if(d.status === 'pending') return '<span class="layui-badge layui-bg-gray">等待中</span>';
                if(d.status === 'running') return '<span class="layui-badge layui-bg-orange">扫描中</span>';
                if(d.status === 'completed') return '<span class="layui-badge layui-bg-green">已完成</span>';
                if(d.status === 'failed') return '<span class="layui-badge layui-bg-red">失败</span>';
                return d.status;
            }},
            {field: 'found_count', title: '发现数量', width: 100},
            {field: 'start_time', title: '开始时间', width: 180, sort: true},
            {field: 'end_time', title: '结束时间', width: 180},
            {fixed: 'right', title: '操作', toolbar: '#scan-history-toolbar', width: 100}
        ]],
        response: {
            statusCode: 200
        },
        parseData: function(res){
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.count,
                "data": res.data
            };
        }
    });
    
    // 扫描历史表格工具条事件
    table.on('tool(scan-history-table)', function(obj){
        var data = obj.data;
        if(obj.event === 'view'){
            // 查看扫描详情
            loadScanDetail(data.id);
        }
    });
    
    // 加载扫描详情
    function loadScanDetail(scanId) {
        $.ajax({
            url: '/manager/api/subdomain/scan/' + scanId + '/',
            type: 'GET',
            success: function(res){
                if(res.code === 200){
                    // 设置详情信息
                    $('#detail-domain').text(res.data.domain);
                    $('#detail-found-count').text('发现 ' + res.data.found_count + ' 个子域名');
                    $('#detail-time').text(res.data.start_time + ' 至 ' + (res.data.end_time || '进行中'));
                    
                    // 渲染详情表格
                    table.render({
                        elem: '#detail-table',
                        data: res.data.results,
                        cols: [[
                            {field: 'host', title: '子域名', width: 250},
                            {field: 'ip', title: 'IP地址', width: 150},
                            {field: 'source', title: '来源'}
                        ]],
                        limit: 1000
                    });
                    
                    // 打开详情弹窗
                    layer.open({
                        type: 1,
                        title: '扫描详情',
                        content: $('#scan-detail-container'),
                        area: ['800px', '600px']
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            },
            error: function(){
                layer.msg('服务器错误', {icon: 2});
            }
        });
    }
    
    // 表单提交事件
    form.on('submit(scan-submit)', function(data){
        // 显示加载层
        var loadIndex = layer.load(2);
        
        // 发送扫描请求
        $.ajax({
            url: '/manager/api/subdomain/scan/',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data.field),
            success: function(res){
                layer.close(loadIndex);
                
                if(res.code === 200){
                    layer.msg('扫描完成', {icon: 1});
                    
                    // 更新当前扫描ID
                    currentScanId = res.data.id;
                    
                    // 显示结果容器
                    $('#no-result-container').hide();
                    $('#result-container').show();
                    
                    // 设置扫描信息
                    $('#scan-domain').text(res.data.domain);
                    $('#found-count').text('发现 ' + res.data.found_count + ' 个子域名');
                    $('#scan-time').text(res.data.start_time + ' 至 ' + (res.data.end_time || '进行中'));
                    
                    // 加载扫描结果
                    loadScanResult(currentScanId);
                    
                    // 刷新扫描历史表格
                    table.reload('scan-history-table');
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            },
            error: function(){
                layer.close(loadIndex);
                layer.msg('服务器错误', {icon: 2});
            }
        });
        
        return false;  // 阻止表单跳转
    });
    
    // 加载扫描结果
    function loadScanResult(scanId) {
        $.ajax({
            url: '/manager/api/subdomain/scan/' + scanId + '/',
            type: 'GET',
            success: function(res){
                if(res.code === 200){
                    // 渲染子域名表格
                    table.render({
                        elem: '#subdomain-table',
                        data: res.data.results,
                        cols: [[
                            {field: 'host', title: '子域名', width: 250},
                            {field: 'ip', title: 'IP地址', width: 150},
                            {field: 'source', title: '来源'}
                        ]],
                        limit: 1000
                    });
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            },
            error: function(){
                layer.msg('服务器错误', {icon: 2});
            }
        });
    }
});
</script>
{% endblock %}
